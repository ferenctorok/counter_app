[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "counter_app"
version = "0.1.0"
description = "A simple REST API for a persistent counter"
authors = [{ name = "Ferenc Török", email = "ferenc.toeroek.bp@gmail.com" }]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "sqlalchemy",
]

[project.urls]
Homepage = "https://github.com/yourusername/counter-api"
