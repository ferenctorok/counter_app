services:
  db:
    image: counter_database:latest
    container_name: counter_database
    environment:
      POSTGRES_USER: &POSTGRES_USER appuser
      POSTGRES_PASSWORD: &POSTGRES_PASSWORD secret
      POSTGRES_DB: &POSTGRES_DB appdb
      POSTGRES_PORT: &POSTGRES_PORT 5432
    ports:
      - 5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d appdb -p 5432"]
      interval: 3s
      timeout: 5s
      retries: 5

  app:
    image: counter_app:latest
    container_name: counter_app
    environment:
      POSTGRES_USER: *POSTGRES_USER
      POSTGRES_PASSWORD: *POSTGRES_PASSWORD
      POSTGRES_DB: *POSTGRES_DB
      POSTGRES_HOST: db
      POSTGRES_PORT: *POSTGRES_PORT
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/home/dev_ws
    ports:
      - "80:80"
    command: >
      /bin/sh -c "
      cd /home/dev_ws &&
      python3 -m pip install counter_app/ &&
      fastapi run counter_app/main.py --port 80
      "
