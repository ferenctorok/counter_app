# Exclude a variety of commonly ignored directories.
exclude = [
    ".eggs",
    "*.egg-info",
    ".git",
    ".mypy_cache",
    ".ruff_cache",
    ".vscode",
    "build",
]

line-length = 80
indent-width = 4

# Assume Python 3.10
target-version = "py310"

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

# Linter settings of Ruff.
[lint]
preview = true
select = [
    "F",    # Enable Pyflakes.
    "E",    # pycodestyle errors.
    "W",    # pycodestyle warnings.
    "I",    # Isort.
    "D",    # pydocstyle.
    "ANN",  # flake8-annotations.
    "C4",   # flake8-comprehensions.
    "PIE",  # flake8-pie.
    "RET",  # flake8-return.
    "SLF",  # flake8-self.
    "ARG",  # flake8-unused-arguments.
    "ERA",  # eradicate.
    "PL",   # pylint.
    "PERF", # perflint
]
ignore = [
    "ANN101",  # Missing type annotation for `self` in method.
    "ANN204",  # Missing return type annotation for special method `__init__`
    "D1",      # Things must have docstrings typ of errors.
    "D203",    # 1 blank line required before class docstring.
    "D212",    # Multi-line docstring summary should start at the first line.
    "D404",    # First word of the docstring should not be "This".
    "D415",    # First line should end with a period, question mark, or exclamation point (Conflicts with D400)
    "D416",    # Section name should end with a colon. (Conflicts D406 in ros)
    "E203",    # Whitespace before punctuation.
    "PLW2901", # redefined-loop-name.
]

[format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"
